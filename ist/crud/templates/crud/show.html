<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th, td {
        padding: 10px;
        text-align: left;
        border: 1px solid #ddd;
      }
      th {
        background-color: #f4f4f4;
      }
      .btn {
        padding: 5px 10px;
        text-decoration: none;
        border-radius: 4px;
        display: inline-block;
        margin: 2px;
        border: none;
        cursor: pointer;
      }
      .btn-warning {
        background-color: #ffc107;
        color: black;
      }
      .btn-danger {
        background-color: #dc3545;
        color: white;
      }
      .btn:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center;">STUDENT LIST</h1>
    <table>
      <thead>
        <tr>
          <th>STUDENT ID</th>
          <th>STUDENT NAME</th>
          <th>STUDENT AGE</th>
          <th>STUDENT EMAIL</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        {% for i in student %}
          <tr>
            <td>{{ i.Sid }}</td>
            <td>{{ i.name }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.email }}</td>
            <td>
              <a href="{% url 'update_url' i.Sid %}" class="btn btn-warning">Update</a>
              <a href="{% url 'delete' i.Sid %}" class="btn btn-danger">Delete</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
